# SnapFlow on a server: the published image and Postgres, nothing else.
#   cp .env.example .env    # then set the passwords and the first admin
#   docker compose up -d    # http://<host>:8000, or behind your TLS reverse proxy
# Update: docker compose pull && docker compose up -d (migrations run on start).
# Back up both volumes: db-data (Postgres) and app-files (uploaded files).
name: snapflow-server

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: snapflow
      POSTGRES_USER: snapflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapflow -d snapflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: ghcr.io/kingkill85/snapflow:${SNAPFLOW_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://snapflow:${POSTGRES_PASSWORD}@db:5432/snapflow?sslmode=disable
      # The first admin, created on start while no active admin exists; ignored after that.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DISTRIBUTOR_NAME: ${DISTRIBUTOR_NAME:-Distributor}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-20}
      STORAGE_DIR: /data/files
    volumes:
      - app-files:/data
    ports:
      - "${SNAPFLOW_BIND:-0.0.0.0}:${SNAPFLOW_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  app-files:
