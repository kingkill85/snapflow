version: "2"
linters:
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    paths:
      - internal/features/.*/store
formatters:
  enable:
    - gofmt
    - goimports
