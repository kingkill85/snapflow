# One entry per feature. `make feature` appends new entries below the marker.
version: "2"
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
      # Translatable columns are listed one by one; other jsonb stays []byte.
      - column: function_types.name
        go_type:
          import: github.com/kingkill85/snapflow/backend/internal/platform/i18n
          type: Text
      - column: users.role
        go_type:
          import: github.com/kingkill85/snapflow/backend/internal/platform/auth
          type: Role
      - column: product_types.name
        go_type:
          import: github.com/kingkill85/snapflow/backend/internal/platform/i18n
          type: Text
      - column: categories.name
        go_type:
          import: github.com/kingkill85/snapflow/backend/internal/platform/i18n
          type: Text
      - column: categories.description
        go_type:
          import: github.com/kingkill85/snapflow/backend/internal/platform/i18n
          type: Text
          pointer: true
      # Attribute schemas (platform/attrschema).
      - column: categories.attributes
        go_type:
          import: github.com/kingkill85/snapflow/backend/internal/platform/attrschema
          type: Schema
      - column: categories.instance_attributes
        go_type:
          import: github.com/kingkill85/snapflow/backend/internal/platform/attrschema
          type: InstanceSchema
      - column: product_types.color
        go_type:
          type: string
          pointer: true
      - db_type: text
        nullable: true
        go_type:
          type: string
          pointer: true
      - db_type: pg_catalog.int4
        nullable: true
        go_type:
          type: int32
          pointer: true
      # Money (numeric) is a decimal string in Go, never a float.
      - db_type: pg_catalog.numeric
        go_type: string
      - db_type: pg_catalog.numeric
        nullable: true
        go_type:
          type: string
          pointer: true
      - column: products.name
        go_type:
          import: github.com/kingkill85/snapflow/backend/internal/platform/i18n
          type: Text
      - column: products.description
        go_type:
          import: github.com/kingkill85/snapflow/backend/internal/platform/i18n
          type: Text
          pointer: true
      - column: products.attributes
        go_type:
          import: github.com/kingkill85/snapflow/backend/internal/platform/attrschema
          type: Values
      - column: product_variants.name
        go_type:
          import: github.com/kingkill85/snapflow/backend/internal/platform/i18n
          type: Text
      - column: product_variants.attributes
        go_type:
          import: github.com/kingkill85/snapflow/backend/internal/platform/attrschema
          type: Values
      # scaffold:overrides
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/features/functiontypes/queries.sql
    gen:
      go: &go
        package: store
        out: internal/features/functiontypes/store
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
  - engine: postgresql
    schema: migrations
    queries: internal/features/tenants/queries.sql
    gen:
      go:
        <<: *go
        out: internal/features/tenants/store
  - engine: postgresql
    schema: migrations
    queries: internal/features/users/queries.sql
    gen:
      go:
        <<: *go
        out: internal/features/users/store
  - engine: postgresql
    schema: migrations
    queries: internal/features/producttypes/queries.sql
    gen:
      go:
        <<: *go
        out: internal/features/producttypes/store
  - engine: postgresql
    schema: migrations
    queries: internal/features/categories/queries.sql
    gen:
      go:
        <<: *go
        out: internal/features/categories/store
  - engine: postgresql
    schema: migrations
    queries: internal/features/files/queries.sql
    gen:
      go:
        <<: *go
        out: internal/features/files/store
  - engine: postgresql
    schema: migrations
    queries: internal/features/products/queries.sql
    gen:
      go:
        <<: *go
        out: internal/features/products/store
  - engine: postgresql
    schema: migrations
    queries: internal/features/imports/queries.sql
    gen:
      go:
        <<: *go
        out: internal/features/imports/store
  - engine: postgresql
    schema: migrations
    queries: internal/features/projects/queries.sql
    gen:
      go:
        <<: *go
        out: internal/features/projects/store
  # scaffold:sqlc
