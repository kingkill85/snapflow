name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            frontend/node_modules
          key: ${{ runner.os }}-${{ hashFiles('backend/go.sum', 'frontend/package-lock.json', 'flake.lock') }}
      - name: Install frontend dependencies
        run: nix develop -c sh -c 'cd frontend && npm ci'
      - name: Generate, lint, test, check generated code is committed
        run: nix develop -c make check
      - name: Build image
        run: docker build -t snapflow:ci .

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            frontend/node_modules
          key: ${{ runner.os }}-${{ hashFiles('backend/go.sum', 'frontend/package-lock.json', 'flake.lock') }}
      - name: Install frontend dependencies
        run: nix develop -c sh -c 'cd frontend && npm ci'
      - name: End-to-end tests (Chromium from Nix, Postgres via docker compose)
        run: nix develop -c make e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report
            frontend/e2e/test-results
          retention-days: 14
