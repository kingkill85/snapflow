# Production-like stack: `docker compose up --build`.
# For development only the database is needed: `make db`.
# A fixed project name, so every checkout (also a git worktree) uses the same database container.
name: snapflow

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: snapflow
      POSTGRES_USER: snapflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snapflow}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapflow -d snapflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The server of the Go tests (`make test-backend`): each test package gets
  # its own database on it. In memory and without fsync, as nothing on it is kept.
  testdb:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: snapflow
      POSTGRES_PASSWORD: snapflow
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=500"]
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55432}:5432"
    healthcheck:
      # Over TCP: during initialisation the server only listens on its socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U snapflow -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 60

  app:
    build: .
    profiles: [app]
    environment:
      DATABASE_URL: postgres://snapflow:${POSTGRES_PASSWORD:-snapflow}@db:5432/snapflow?sslmode=disable
      # The first admin, created when no active admin exists.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Only needed when serving over plain HTTP on a host other than localhost.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Reverse proxies (CIDRs) whose X-Forwarded-For header is trusted.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-20}
      # Uploaded files (product images); back up with the database.
      STORAGE_DIR: /data/files
    volumes:
      - app-files:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  app-files:
